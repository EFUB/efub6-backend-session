plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.practice'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'io.jsonwebtoken:jjwt:0.12.6'
	implementation 'javax.xml.bind:jaxb-api:2.3.1'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2' // 테스트에 사용할 H2
	}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs "-Xshare:off"
}

def registerK6LoadTest = { String taskName, String targetPath ->
	tasks.register(taskName, Exec) {
		group = 'load testing'
		description = "Run k6 against ${targetPath}"
		workingDir projectDir
		commandLine 'k6', 'run',
			'-e', 'BASE_URL=http://localhost:8080',
			'-e', "TARGET_PATH=${targetPath}",
			'-e', 'HTTP_METHOD=GET',
			'-e', 'MAX_P95_MS=500',
			'-e', 'MAX_ERROR_RATE=0.01',
			'-e', 'MAX_RESPONSE_BYTES=100000',
			'load-tests/http.js'
	}
}

registerK6LoadTest('loadTestAllPosts', '/posts/all')
registerK6LoadTest('loadTestPaginatedPosts', '/posts?page=0&size=20')

def registerHotRowLoadTest = { String taskName, String mode ->
	tasks.register(taskName, Exec) {
		group = 'load testing'
		description = "Run the ${mode} row-access scenario"
		workingDir projectDir
		commandLine 'k6', 'run',
			'-e', 'BASE_URL=http://localhost:8080',
			'-e', "HOT_ROW_MODE=${mode}",
			'-e', 'TARGET_VUS=20',
			'-e', 'SLEEP_SECONDS=0.1',
			'-e', 'MAX_P95_MS=500',
			'load-tests/hot-row.js'
	}
}

registerHotRowLoadTest('loadTestHotRowBefore', 'single')
registerHotRowLoadTest('loadTestHotRowAfter', 'sharded')

tasks.register('seedLoadTestData', JavaExec) {
	group = 'load testing'
	description = 'Create the 10,000 MySQL posts used by the load-test practice'
	dependsOn tasks.named('classes')
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.practice.efubaccount.EfubaccountApplication'
	args '--server.port=0',
		'--loadtest.seed.enabled=true',
		'--loadtest.seed.exit-after-completion=true'
}
